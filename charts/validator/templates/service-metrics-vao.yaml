{{- if and .Values.global.metrics.enabled .Values.vao.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "validator.fullname" . }}-metrics-vao
  annotations:
  {{- /* Not vao.service.annotations: load balancer annotations there would give this ClusterIP Service its own LB (AWS LBC ignores spec.type). */}}
  {{- with (.Values.global.metrics.service | default dict).annotations }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "validatorVao.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.global.metrics.port }}
      protocol: TCP
      targetPort: {{ .Values.global.metrics.port }}
  selector:
    {{- include "validatorVao.selectorLabels" . | nindent 4 }}
{{- end }}
