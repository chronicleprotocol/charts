# Same as testnet-envs-values.yaml, but CFG_CHAIN_RPC_URLS comes from a Secret through rpcUrlSecret.
# rpcUrl is empty, so the relay only starts if the Secret path works. No CFG_ETH_* is set,
# so the inline config falls back to a random key.
rpcUrl: ""
# -- must match target chain
chainId: '11155111'
# -- can be one of `legacy`or `eip1559`
txType: legacy
# -- can be one of mainnet: `eth`, `arb`, `opt`, `gno`, `scr`, `zkevm`, `mantle`, or testnets: `gor`, `sep`, `ogor`, `mango`, `testnet-zkEVM-mango`, `mantle-testnet`, `scr-sepolia`
chainType: sep

inlineConfig: |
  variables {
    separator       = env("CFG_SEPARATOR", "\n")
    target_chain_id = env("CFG_CHAIN_ID", "11155111")
  }
  ethereum {
    rand_keys = env("CFG_ETH_FROM", "") == "" ? ["default"] : []
    dynamic "key" {
      for_each = env("CFG_ETH_FROM", "") == "" ? [] : [1]
      labels   = ["default"]
      content {
        address         = env("CFG_ETH_FROM", "")
        keystore_path   = env("CFG_ETH_KEYS", "")
        passphrase_file = env("CFG_ETH_PASS", "")
      }
    }
    client "default" {
      ethereum_key = "default"
      rpc_urls     = explode(var.separator, env("CFG_CHAIN_RPC_URLS", ""))
      chain_id     = tonumber(env("CFG_CHAIN_ID", "11155111"))
      tx_type      = env("CFG_CHAIN_TX_TYPE", "legacy")
    }
  }
  info {
    ethereum_key = "default"
  }
  logger {
    log_level  = env("CFG_LOG_LEVEL", "debug")
    log_format = env("CFG_LOG_FORMAT", "text")
    metrics {
      listen_host = ""
      listen_port = 8080
      listen_path = "/healthz"
    }
  }
  transport {
    libp2p {
      disable_discovery = true
      ethereum_key      = "default"
      listen_addrs      = explode(var.separator, env("CFG_LIBP2P_LISTEN_ADDRS", "/ip4/0.0.0.0/tcp/8000"))
      feeds             = []
    }
  }
  spectre {
    scheduler = tonumber(env("CFG_SPECTRE_INTERVAL", "120"))
    scribe {
      ethereum_client = "default"
      contract_addr   = "0x0000000000000000000000000000000000000001"
      spread          = 1.0
      expiration      = 86400
    }
  }

rpcUrlSecret:
  name: spectre-ci-rpc
  key: CFG_CHAIN_RPC_URLS

extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: spectre-ci-rpc
    type: Opaque
    stringData:
      CFG_CHAIN_RPC_URLS: https://ethereum-sepolia.blockpi.network/v1/rpc/public
